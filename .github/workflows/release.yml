# Pushing a tag vX.Y.Z publishes the release, and vX.Y.Z-rc.N a prerelease. The
# build jobs hold no secrets. On macOS, a separate job signs and notarises the
# bundle with the Developer ID, from the secrets of the environment "release",
# which admits only tags. To redo a release, run this workflow by hand from its
# tag, under "Use workflow from". The refs below must match the core's ref in
# mirante.json. See docs/decisions/0126-macos-signing-is-a-separate-job.md in
# mirante-core.

name: Release
# Each run is titled after its tag, such as "Release v0.8.1".
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'tag'
    uses: rrgmc/mirante-core/.github/workflows/build-app.yml@v0.8.4
    with:
      release-tag: ${{ github.ref_name }}
      macos-signing: developer-id
    # The signing job reads the certificate's password, a repository secret,
    # and the environment's secrets. The build jobs read none.
    secrets: inherit

  publish:
    needs: build
    permissions:
      contents: write
    uses: rrgmc/mirante-core/.github/workflows/release-app.yml@v0.8.4
    with:
      tag: ${{ github.ref_name }}
      edition: ${{ needs.build.outputs.edition }}

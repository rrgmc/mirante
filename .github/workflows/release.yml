# Pushing a tag vX.Y.Z publishes a GitHub release for it, builds and tests
# Mirante on Windows, macOS and Linux, then attaches the Windows setup, the
# notarised macOS disk image and the Ubuntu .deb package to the release. To
# redo it for an existing tag, run the workflow by hand from that tag, under
# "Use workflow from", and give the same tag: the release environment admits
# only tags. See docs/releasing.md and docs/plans/m10-packaging.md.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  QT_VERSION: 6.8.3

permissions:
  contents: write

jobs:
  # Checks the tag and publishes its release, unless one exists already. A
  # release published with the workflow's token starts no other workflow.
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from the tag
        id: version
        run: |
          version="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already"
          else
            gh release create "$TAG" --verify-tag --generate-notes \
              --title "Mirante ${{ steps.version.outputs.version }}"
          fi

  windows-setup:
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-pdf

      - name: Install NSIS
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build, test and package
        shell: pwsh
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
        run: ./tools/build.ps1 -Preset ci -Version "${{ needs.release.outputs.version }}" -Package

      - name: Attach the setup to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            "build/ci/mirante-${{ needs.release.outputs.version }}-win64.exe" --clobber

  linux-deb:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-pdf

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 dpkg-dev

      - name: Build, test and package
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Tests load data: URLs only. See ci.yml.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR" \
            "-DMIRANTE_VERSION=${{ needs.release.outputs.version }}"
          cmake --build --preset ci
          ctest --preset ci
          cmake --install build/ci --component Mirante --prefix "$PWD/build/ci/install"
          python3 tools/check-package.py build/ci/install
          cd build/ci && cpack

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            "build/ci/mirante_${{ needs.release.outputs.version }}_amd64.deb" --clobber

  macos-dmg:
    needs: release
    runs-on: macos-15
    # The signing secrets live in this environment, which admits only version
    # tags. See docs/releasing.md.
    environment: release
    steps:
      # Pinned to commits: this job holds the signing secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Cache Qt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-pdf

      - name: Install Ninja
        run: brew install ninja

      # A keychain of its own, with a random password, holds the Developer ID
      # certificate for this job only. The last step deletes it.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      # Checks the key before the build, and shows notarytool's error if Apple
      # refuses it.
      - name: Write and check the notarisation key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" > /dev/null

      - name: Build, test, sign and notarise
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          MIRANTE_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          MIRANTE_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          MIRANTE_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: sh tools/release-macos.sh "${{ needs.release.outputs.version }}"

      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            "build/macos-release/mirante-${{ needs.release.outputs.version }}-macos.dmg" --clobber

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

# Builds and tests Mirante on Windows, macOS and Linux, with all modules and
# with none, and checks that modules include only the module API and that every
# text is translated. Each build also makes its package and keeps it for a
# week. The packages are not signed; releases come from release.yml.
# Qt comes from tools/setup-qt, as in local builds, into a cached folder
# outside the checkout. ccache keeps compiled objects between runs, and the
# tests run in parallel. A pull request that changes only documentation
# builds nothing. See docs/plans/m2-app-skeleton.md, part 1,
# docs/plans/m10-packaging.md,
# docs/decisions/0110-ci-runs-once-per-change-and-caches-compiling.md and
# docs/decisions/0113-ci-skips-documentation-only-changes.md.

name: CI
# Pull request runs lead with the number. Other runs keep GitHub's default
# title, because an empty run-name means the default.
run-name: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

on:
  # Work branches are checked by their pull request, so a push to one does not
  # start a second run of the same commit. Tags start release.yml, which builds
  # and tests on its own.
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels its run that is still going. Runs on
# master all finish, since they fill the caches that pull requests read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  QT_VERSION: 6.8.3
  # The runners have three or four cores. Most tests spend their time waiting
  # on timers, so four at a time keeps the cores busy.
  CTEST_PARALLEL_LEVEL: 4

jobs:
  # Decides whether the run builds anything. A pull request whose files are
  # all under docs/ or end in .md changes no build input, so code is false.
  # Pushes to master always build, since they fill the caches. The other jobs
  # skip only when code is exactly false, so if this job fails, they build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, so nothing is built."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Each step checks code rather than the job, because a skipped matrix job
  # reports one check under an unexpanded name, and the required checks
  # "build (windows-2022)" and "build (ubuntu-24.04)" would never report.
  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        if: env.CODE != 'false'

      - uses: astral-sh/setup-uv@v6
        if: env.CODE != 'false'

      - name: Cache Qt
        if: env.CODE != 'false'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          # Change the last part when setup-qt installs other archives.
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-pdf

      # CMakeLists.txt compiles through ccache when it finds it. Only runs on
      # master save the cache: a pull request's cache would be visible to that
      # pull request only, and would push master's out of the 10 GB limit.
      - name: Cache compiling
        if: env.CODE != 'false'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-ci
          max-size: 500M
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux packages
        if: env.CODE != 'false' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 dpkg-dev

      - name: Install macOS packages
        if: env.CODE != 'false' && runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: env.CODE != 'false' && runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      # build.ps1 gets Qt, enters the Visual Studio 2022 developer shell,
      # configures, builds and tests the preset, then installs, checks and
      # packages it.
      - name: Build, test and package (Windows)
        if: env.CODE != 'false' && runner.os == 'Windows'
        shell: pwsh
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
        run: ./tools/build.ps1 -Preset ci -Package

      - name: Build and test (macOS, Linux)
        if: env.CODE != 'false' && runner.os != 'Windows'
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Qt WebEngine checks only that the variable is set, so it is
          # off on macOS too, which is harmless: tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR"
          cmake --build --preset ci
          ctest --preset ci

      - name: Package (macOS, Linux)
        if: env.CODE != 'false' && runner.os != 'Windows'
        run: |
          cmake --install build/ci --component Mirante --prefix "$PWD/build/ci/install"
          python3 tools/check-package.py build/ci/install
          cd build/ci && cpack

      - uses: actions/upload-artifact@v4
        if: env.CODE != 'false'
        with:
          name: mirante-${{ runner.os }}
          path: |
            build/ci/mirante-*-win64.exe
            build/ci/mirante-*-macos.dmg
            build/ci/mirante_*.deb
          if-no-files-found: error
          retention-days: 7

  # A job skipped by its condition counts as passed for a required check.
  # !cancelled() lets it run when the changes job failed.
  no-modules:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-pdf

      - name: Cache compiling
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-24.04-ci-no-modules
          max-size: 500M
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0

      - name: Build and test
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          # Without precompiled headers, a file that misses an include fails.
          # This job ends before the Windows build, so it costs no time.
          cmake --preset ci-no-modules -DCMAKE_PREFIX_PATH="$QT_DIR" -DMIRANTE_PCH=OFF
          cmake --build --preset ci-no-modules
          ctest --preset ci-no-modules

      # lupdate reads every module's sources, also in a build without them.
      # The committed translation files must be up to date and complete.
      - name: Check translations
        run: |
          cmake --build --preset ci-no-modules --target update_translations
          python3 tools/translation-glossary.py
          python3 tools/check-translations.py
          git diff --exit-code translations/

  module-includes:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check module includes
        run: python tools/check-module-includes.py

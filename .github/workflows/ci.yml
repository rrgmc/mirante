# Builds, tests and packages this app with the core's workflow. The ref below
# must match the core's ref in mirante.json.

name: CI
# Pull request runs lead with the number. Other runs keep GitHub's default
# title, because an empty run-name means the default.
run-name: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

on:
  push:
    branches: [master]
  pull_request:
  # A pull request in the merge queue is checked again on top of master, so
  # that branches need not be brought up to date by hand. See decision 0154
  # in mirante-core.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: rrgmc/mirante-core/.github/workflows/build-app.yml@v0.15.0

# Builds and tests Mirante on Windows, macOS and Linux, with all modules and
# with none, and checks that modules include only the module API and that every
# text is translated. Each build also makes its package and keeps it for a
# week. The packages are not signed; releases come from release.yml.
# Qt comes from tools/setup-qt, as in local builds, into a cached folder
# outside the checkout. See docs/plans/m2-app-skeleton.md, part 1, and
# docs/plans/m10-packaging.md.

name: CI

on:
  # Tags start release.yml, which builds and tests on its own.
  push:
    branches: ['**']
  pull_request:

env:
  QT_VERSION: 6.8.3

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          # Change the last part when setup-qt installs other archives.
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0             dpkg-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      # build.ps1 gets Qt, enters the Visual Studio 2022 developer shell,
      # configures, builds and tests the preset, then installs, checks and
      # packages it.
      - name: Build, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
        run: ./tools/build.ps1 -Preset ci -Package

      - name: Build and test (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Qt WebEngine checks only that the variable is set, so it is
          # off on macOS too, which is harmless: tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR"
          cmake --build --preset ci
          ctest --preset ci

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --install build/ci --component Mirante --prefix "$PWD/build/ci/install"
          python3 tools/check-package.py build/ci/install
          cd build/ci && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: mirante-${{ runner.os }}
          path: |
            build/ci/mirante-*-win64.exe
            build/ci/mirante-*-macos.dmg
            build/ci/mirante_*.deb
          if-no-files-found: error
          retention-days: 7

  no-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0

      - name: Build and test
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh tools/setup-qt.sh)
          cmake --preset ci-no-modules -DCMAKE_PREFIX_PATH="$QT_DIR"
          cmake --build --preset ci-no-modules
          ctest --preset ci-no-modules

      # lupdate reads every module's sources, also in a build without them.
      # The committed translation files must be up to date and complete.
      - name: Check translations
        run: |
          cmake --build --preset ci-no-modules --target update_translations
          python3 tools/translation-glossary.py
          python3 tools/check-translations.py
          git diff --exit-code translations/

  module-includes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check module includes
        run: python tools/check-module-includes.py

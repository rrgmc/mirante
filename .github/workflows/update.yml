# Once a week, opens a pull request that moves the pins to the newest release
# tags of the core and the modules, and raises the patch version. Mirante
# releases from a pushed tag, so after merging one, push its tag vX.Y.Z. It
# needs the secret MIRANTE_UPDATE_TOKEN: see the README. The ref below must
# match the core's ref in mirante.json.

name: Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: rrgmc/mirante-core/.github/workflows/update-app.yml@v0.8.0
    secrets:
      token: ${{ secrets.MIRANTE_UPDATE_TOKEN }}
